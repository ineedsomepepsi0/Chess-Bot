<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play the Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2320;
    --panel:#ece4d3;
    --panel-edge:#d7cab0;
    --bg:#221b16;
    --bg-raised:#2c231d;
    --square-light:#e8dcc8;
    --square-dark:#7c5c42;
    --accent:#b8935f;
    --accent-strong:#8f6a3a;
    --flag:#9c4a32;
    --ok:#5c7a52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--panel);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
  }
  .wrap{width:100%;max-width:920px;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h1{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:34px;
    margin:0;
    color:var(--panel);
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(320px,540px) 300px;
    gap:24px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
  }

  /* Board */
  .board-card{
    background:var(--panel);
    border-radius:6px;
    padding:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    aspect-ratio:1/1;
    border:2px solid var(--accent-strong);
    border-radius:2px;
    overflow:hidden;
  }
  .sq{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    padding:0;
    font-size:clamp(22px,5vw,42px);
    cursor:pointer;
    line-height:1;
  }
  .sq.light{background:var(--square-light);}
  .sq.dark{background:var(--square-dark);}
  .sq:disabled{cursor:default;}
  .sq .piece-w{color:#fbf6ec;text-shadow:0 1px 0 #4a3320, 0 -1px 0 #4a3320, 1px 0 0 #4a3320, -1px 0 0 #4a3320;}
  .sq .piece-b{color:#1c1410;}
  .sq.selected{box-shadow:inset 0 0 0 3px var(--accent);}
  .sq.last-move{box-shadow:inset 0 0 0 3px rgba(156,74,50,.75);}
  .sq .dot{
    position:absolute;
    width:26%;
    height:26%;
    border-radius:50%;
    background:rgba(43,35,32,.35);
  }
  .sq .ring{
    position:absolute;
    inset:8%;
    border-radius:50%;
    box-shadow:inset 0 0 0 4px rgba(43,35,32,.35);
  }
  .file-rank{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink);
    opacity:.55;
    position:absolute;
    top:2px;
    left:3px;
  }

  /* Promotion picker */
  .promo-overlay{
    position:absolute;inset:0;background:rgba(34,27,22,.72);
    display:flex;align-items:center;justify-content:center;z-index:5;
    border-radius:4px;
  }
  .promo-box{background:var(--panel);border-radius:6px;padding:14px;display:flex;gap:10px;}
  .promo-box button{
    width:52px;height:52px;font-size:30px;border-radius:4px;border:1px solid var(--panel-edge);
    background:var(--square-light);cursor:pointer;
  }
  .promo-box button:hover{background:var(--accent);}

  /* Side panel */
  .panel{
    background:var(--bg-raised);
    border:1px solid #3a2f26;
    border-radius:6px;
    padding:18px;
  }
  .panel h2{
    font-family:'Lora',serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--accent);
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#b8ab98;
    margin-bottom:6px;
  }
  .segmented{
    display:flex;
    border:1px solid var(--accent-strong);
    border-radius:4px;
    overflow:hidden;
  }
  .segmented button{
    flex:1;
    padding:8px 4px;
    background:transparent;
    color:var(--panel);
    border:none;
    border-right:1px solid var(--accent-strong);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13px;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--accent);color:#221b16;font-weight:600;}
  .segmented button:focus-visible{outline:2px solid var(--panel);outline-offset:-2px;}

  .btn-primary{
    width:100%;
    padding:11px;
    background:var(--flag);
    color:#f6ece7;
    border:none;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-primary:hover{background:#b25a3d;}
  .btn-primary:focus-visible{outline:2px solid var(--panel);outline-offset:2px;}

  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:10px 12px;
    background:#221b16;
    border-radius:4px;
    margin-bottom:16px;
    min-height:18px;
  }
  .status-line.check{color:var(--flag);}
  .status-line.over{color:var(--ok);}

  .scoresheet{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    max-height:260px;
    overflow-y:auto;
    border-top:1px solid #3a2f26;
  }
  .scoresheet .row{
    display:grid;
    grid-template-columns:28px 1fr 1fr;
    gap:6px;
    padding:5px 2px;
    border-bottom:1px solid #2f261f;
  }
  .scoresheet .num{color:#8a7c69;}
  .scoresheet .white-move{color:#f2ece1;}
  .scoresheet .black-move{color:#c9bba3;}

  footer{
    margin-top:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#7a6c5a;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Chess Engine Demo — PHP</p>
    <h1>Play the Engine</h1>
  </header>

  <div class="layout">
    <div class="board-card">
      <div class="board" id="board" aria-label="Chess board"></div>
    </div>

    <div class="panel">
      <div class="field">
        <label for="">Difficulty</label>
        <div class="segmented" id="difficulty-seg">
          <button data-val="beginner" class="active">Beginner</button>
          <button data-val="medium">Medium</button>
          <button data-val="expert">Expert</button>
        </div>
      </div>
      <div class="field">
        <label>Play as</label>
        <div class="segmented" id="color-seg">
          <button data-val="white" class="active">White</button>
          <button data-val="black">Black</button>
        </div>
      </div>
      <button class="btn-primary" id="new-game-btn">New Game</button>

      <h2 style="margin-top:22px;">Status</h2>
      <div class="status-line" id="status-line">Set your options and start a game.</div>

      <h2>Scoresheet</h2>
      <div class="scoresheet" id="scoresheet"></div>
    </div>
  </div>

  <footer>Endpoints: new_game · state · move · legal_moves · reset — see api.php</footer>
</div>

<script>
const API = 'api.php';
const PIECE_GLYPH = {
  P:'♙', N:'♘', B:'♗', R:'♖', Q:'♕', K:'♔',
  p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚',
};
const FILES = ['a','b','c','d','e','f','g','h'];

let state = null;
let selected = null;       // square string, e.g. "e2"
let legalDests = [];       // array of destination squares for `selected`
let difficulty = 'beginner';
let playerColor = 'white';
let busy = false;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status-line');
const scoresheetEl = document.getElementById('scoresheet');

function squareOf(row, col){ // row 0 = rank8 (top), col 0 = file a, matching state.board layout
  const rank = 8 - row;
  return FILES[col] + rank;
}

async function api(action, opts = {}) {
  const res = await fetch(`${API}?action=${action}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function setSegActive(container, val){
  container.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.val === val));
}

document.getElementById('difficulty-seg').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  difficulty = e.target.dataset.val;
  setSegActive(e.currentTarget, difficulty);
});
document.getElementById('color-seg').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  playerColor = e.target.dataset.val;
  setSegActive(e.currentTarget, playerColor);
});

document.getElementById('new-game-btn').addEventListener('click', startNewGame);

async function startNewGame(){
  setBusy(true, 'Starting game…');
  try {
    const data = await api('new_game', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ difficulty, playerColor }),
    });
    selected = null; legalDests = [];
    state = data;
    render();
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    setBusy(false);
  }
}

function setBusy(val, msg){
  busy = val;
  if (val && msg) statusEl.textContent = msg;
}

function playerColorCode(){ return playerColor === 'white' ? 'w' : 'b'; }

async function onSquareClick(square){
  if (busy || !state || state.status) return;
  if (state.turn !== playerColorCode()) return;

  const [row, col] = [8 - parseInt(square[1]), FILES.indexOf(square[0])];
  const piece = state.board[row][col];
  const isOwnPiece = piece && (playerColorCode() === 'w' ? piece === piece.toUpperCase() : piece === piece.toLowerCase());

  if (selected && legalDests.includes(square)) {
    const fromPiece = state.board[8 - parseInt(selected[1])][FILES.indexOf(selected[0])];
    const isPromotion = fromPiece.toUpperCase() === 'P' && (square[1] === '8' || square[1] === '1');
    if (isPromotion) {
      showPromotionPicker(selected, square);
      return;
    }
    await makeMove(selected, square);
    return;
  }

  if (isOwnPiece) {
    selected = square;
    const data = await api(`legal_moves&square=${square}`);
    legalDests = data.legalMoves;
    render();
  } else {
    selected = null; legalDests = [];
    render();
  }
}

async function makeMove(from, to, promotion){
  setBusy(true, 'Engine is thinking…');
  selected = null; legalDests = [];
  try {
    const body = { from, to };
    if (promotion) body.promotion = promotion;
    const data = await api('move', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    state = data;
    render();
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
    render();
  } finally {
    setBusy(false);
  }
}

function showPromotionPicker(from, to){
  const overlay = document.createElement('div');
  overlay.className = 'promo-overlay';
  const box = document.createElement('div');
  box.className = 'promo-box';
  const isWhite = playerColorCode() === 'w';
  const choices = isWhite ? ['Q','R','B','N'] : ['q','r','b','n'];
  choices.forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = PIECE_GLYPH[p];
    btn.addEventListener('click', () => {
      overlay.remove();
      makeMove(from, to, p.toLowerCase());
    });
    box.appendChild(btn);
  });
  overlay.appendChild(box);
  document.getElementById('board').appendChild(overlay);
}

function render(){
  boardEl.innerHTML = '';
  if (!state) return;

  const lastFrom = state.lastMove ? state.lastMove.from : null;
  const lastTo = state.lastMove ? state.lastMove.to : null;

  for (let row = 0; row < 8; row++){
    for (let col = 0; col < 8; col++){
      const square = squareOf(row, col);
      const piece = state.board[row][col];
      const isLight = (row + col) % 2 === 1;

      const btn = document.createElement('button');
      btn.className = 'sq ' + (isLight ? 'light' : 'dark');
      btn.setAttribute('aria-label', square + (piece ? ' ' + piece : ' empty'));

      if (square === selected) btn.classList.add('selected');
      if (square === lastFrom || square === lastTo) btn.classList.add('last-move');

      if (piece){
        const span = document.createElement('span');
        span.className = piece === piece.toUpperCase() ? 'piece-w' : 'piece-b';
        span.textContent = PIECE_GLYPH[piece];
        btn.appendChild(span);
      }
      if (legalDests.includes(square)){
        const marker = document.createElement('span');
        marker.className = piece ? 'ring' : 'dot';
        btn.appendChild(marker);
      }

      btn.disabled = busy || !!state.status || state.turn !== playerColorCode();

      btn.addEventListener('click', () => onSquareClick(square));
      boardEl.appendChild(btn);
    }
  }

  renderStatus();
  renderScoresheet();
}

function renderStatus(){
  statusEl.classList.remove('check','over');
  if (!state){ statusEl.textContent = 'Set your options and start a game.'; return; }

  if (state.status){
    statusEl.classList.add('over');
    const map = {
      checkmate: `Checkmate — ${state.winner === playerColorCode() ? 'you win' : 'the engine wins'}.`,
      stalemate: 'Draw by stalemate.',
      draw_insufficient: 'Draw — insufficient material.',
      draw_50move: 'Draw — 50-move rule.',
      draw_repetition: 'Draw — threefold repetition.',
    };
    statusEl.textContent = map[state.status] || 'Game over.';
    return;
  }

  const turnLabel = state.turn === playerColorCode() ? 'Your move' : 'Engine\u2019s move';
  let text = turnLabel + (state.turn === 'w' ? ' (White)' : ' (Black)');
  if (state.inCheck){
    statusEl.classList.add('check');
    text += ' — check';
  }
  if (state.aiThinkTimeMs){
    text += ` · engine took ${(state.aiThinkTimeMs/1000).toFixed(2)}s`;
  }
  statusEl.textContent = text;
}

function renderScoresheet(){
  scoresheetEl.innerHTML = '';
  if (!state) return;
  const moves = state.moveLog;
  for (let i = 0; i < moves.length; i += 2){
    const row = document.createElement('div');
    row.className = 'row';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = (i/2 + 1) + '.';
    const white = document.createElement('span');
    white.className = 'white-move';
    white.textContent = moves[i] ? moves[i].san : '';
    const black = document.createElement('span');
    black.className = 'black-move';
    black.textContent = moves[i+1] ? moves[i+1].san : '';
    row.append(num, white, black);
    scoresheetEl.appendChild(row);
  }
  scoresheetEl.scrollTop = scoresheetEl.scrollHeight;
}

// initial empty board render (all light/dark squares, no pieces) so the layout isn't blank pre-game
(function initialRender(){
  for (let row = 0; row < 8; row++){
    for (let col = 0; col < 8; col++){
      const isLight = (row + col) % 2 === 1;
      const btn = document.createElement('button');
      btn.className = 'sq ' + (isLight ? 'light' : 'dark');
      btn.disabled = true;
      boardEl.appendChild(btn);
    }
  }
})();
</script>
</body>
</html>
